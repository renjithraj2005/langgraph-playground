<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking Assistant</title>
    <style>
        :root {
            --primary-color: #10a37f;
            --primary-hover: #0e8e6d;
            --bg-color: #343541;
            --chat-bg: #444654;
            --text-color: #ececf1;
            --border-color: #565869;
            --input-bg: #40414f;
            --sidebar-bg: #202123;
            --sidebar-hover: #2a2b32;
            --code-bg: #1e1e1e;
            --code-color: #d4d4d4;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }
        
        .sidebar {
            width: 260px;
            background-color: var(--sidebar-bg);
            padding: 10px;
            display: flex;
            flex-direction: column;
            border-right: 1px solid var(--border-color);
        }
        
        .sidebar-header {
            padding: 10px;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 10px;
        }
        
        .new-chat-btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 4px;
            padding: 10px 15px;
            cursor: pointer;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
            width: 100%;
            margin-bottom: 10px;
            transition: background-color 0.2s;
        }
        
        .new-chat-btn:hover {
            background-color: var(--primary-hover);
        }
        
        .chat-history {
            flex: 1;
            overflow-y: auto;
        }
        
        .chat-item {
            padding: 10px;
            border-radius: 4px;
            cursor: pointer;
            margin-bottom: 5px;
            font-size: 14px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .chat-item:hover {
            background-color: var(--sidebar-hover);
        }
        
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        
        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
        }
        
        .message {
            padding: 20px;
            margin-bottom: 10px;
            display: flex;
            align-items: flex-start;
            max-width: 100%;
        }
        
        .message-content {
            max-width: 800px;
            margin: 0 auto;
            width: 100%;
        }
        
        .user-message {
            background-color: var(--bg-color);
        }
        
        .bot-message {
            background-color: var(--chat-bg);
        }
        
        .avatar {
            width: 30px;
            height: 30px;
            border-radius: 4px;
            margin-right: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            flex-shrink: 0;
        }
        
        .user-avatar {
            background-color: #5436da;
            color: white;
        }
        
        .bot-avatar {
            background-color: var(--primary-color);
            color: white;
        }
        
        .message-text {
            flex: 1;
            overflow-wrap: break-word;
        }
        
        .message-text pre {
            background-color: var(--code-bg);
            color: var(--code-color);
            padding: 15px;
            border-radius: 4px;
            overflow-x: auto;
            margin: 10px 0;
            font-family: 'Courier New', Courier, monospace;
        }
        
        .message-text code {
            background-color: var(--code-bg);
            color: var(--code-color);
            padding: 2px 4px;
            border-radius: 3px;
            font-family: 'Courier New', Courier, monospace;
        }
        
        .message-text p {
            margin-bottom: 10px;
        }
        
        .message-text ul, .message-text ol {
            margin-left: 20px;
            margin-bottom: 10px;
        }
        
        .input-container {
            padding: 20px;
            background-color: var(--bg-color);
            border-top: 1px solid var(--border-color);
        }
        
        .input-wrapper {
            max-width: 800px;
            margin: 0 auto;
            position: relative;
        }
        
        .chat-input {
            width: 100%;
            padding: 12px 45px 12px 15px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            background-color: var(--input-bg);
            color: var(--text-color);
            font-size: 16px;
            resize: none;
            outline: none;
            min-height: 52px;
            max-height: 200px;
            overflow-y: auto;
        }
        
        .send-button {
            position: absolute;
            right: 10px;
            bottom: 10px;
            background: none;
            border: none;
            color: var(--primary-color);
            cursor: pointer;
            font-size: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 30px;
            height: 30px;
            border-radius: 4px;
            transition: background-color 0.2s;
        }
        
        .send-button:hover {
            background-color: rgba(16, 163, 127, 0.1);
        }
        
        .send-button:disabled {
            color: var(--border-color);
            cursor: not-allowed;
        }
        
        .typing-indicator {
            display: none;
            padding: 20px;
            background-color: var(--chat-bg);
            margin-bottom: 10px;
        }
        
        .typing-indicator-content {
            max-width: 800px;
            margin: 0 auto;
            display: flex;
            align-items: center;
        }
        
        .typing-dots {
            display: flex;
            gap: 4px;
        }
        
        .typing-dot {
            width: 8px;
            height: 8px;
            background-color: var(--text-color);
            border-radius: 50%;
            animation: typing 1.4s infinite;
            opacity: 0.6;
        }
        
        .typing-dot:nth-child(2) {
            animation-delay: 0.2s;
        }
        
        .typing-dot:nth-child(3) {
            animation-delay: 0.4s;
        }
        
        @keyframes typing {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }
        
        @media (max-width: 768px) {
            .sidebar {
                display: none;
            }
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="sidebar-header">
            <h2>Booking Assistant</h2>
        </div>
        <button class="new-chat-btn">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 4V20M4 12H20" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            New Chat
        </button>
        <div class="chat-history">
            <!-- Chat history items would go here -->
        </div>
    </div>
    
    <div class="main-content">
        <div class="chat-container" id="chat-messages">
            <div class="message bot-message">
                <div class="message-content">
                    <div class="avatar bot-avatar">S</div>
                    <div class="message-text">
                        <p>Hello! I'm your Booking Assistant. How can I help you today?</p>
                    </div>
                </div>
            </div>
            <div class="typing-indicator" id="typing-indicator">
                <div class="typing-indicator-content">
                    <div class="avatar bot-avatar">S</div>
                    <div class="typing-dots">
                        <div class="typing-dot"></div>
                        <div class="typing-dot"></div>
                        <div class="typing-dot"></div>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="input-container">
            <div class="input-wrapper">
                <textarea class="chat-input" id="user-input" placeholder="Type your message here..." rows="1"></textarea>
                <button class="send-button" id="send-button">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M22 2L11 13M22 2L15 22L11 13L2 9L22 2Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const chatMessages = document.getElementById('chat-messages');
            const userInput = document.getElementById('user-input');
            const sendButton = document.getElementById('send-button');
            const typingIndicator = document.getElementById('typing-indicator');
            const newChatButton = document.querySelector('.new-chat-btn');

            // Auto-resize textarea
            userInput.addEventListener('input', function() {
                this.style.height = 'auto';
                this.style.height = (this.scrollHeight) + 'px';
            });

            // Function to add a message to the chat
            function addMessage(message, isUser) {
                const messageElement = document.createElement('div');
                messageElement.classList.add('message');
                messageElement.classList.add(isUser ? 'user-message' : 'bot-message');
                
                const messageContent = document.createElement('div');
                messageContent.classList.add('message-content');
                
                const avatar = document.createElement('div');
                avatar.classList.add('avatar');
                avatar.classList.add(isUser ? 'user-avatar' : 'bot-avatar');
                avatar.textContent = isUser ? 'U' : 'S';
                
                const messageText = document.createElement('div');
                messageText.classList.add('message-text');
                
                // Check if the message contains code blocks
                if (message.includes('```')) {
                    const parts = message.split('```');
                    for (let i = 0; i < parts.length; i++) {
                        if (i % 2 === 0) {
                            // Regular text
                            const p = document.createElement('p');
                            p.textContent = parts[i];
                            messageText.appendChild(p);
                        } else {
                            // Code block
                            const pre = document.createElement('pre');
                            pre.textContent = parts[i];
                            messageText.appendChild(pre);
                        }
                    }
                } else {
                    // Regular text
                    const p = document.createElement('p');
                    p.textContent = message;
                    messageText.appendChild(p);
                }
                
                messageContent.appendChild(avatar);
                messageContent.appendChild(messageText);
                messageElement.appendChild(messageContent);
                
                // Insert before the typing indicator
                chatMessages.insertBefore(messageElement, typingIndicator);
                
                // Scroll to the bottom
                chatMessages.scrollTop = chatMessages.scrollHeight;
            }

            // Function to show/hide typing indicator
            function toggleTypingIndicator(show) {
                typingIndicator.style.display = show ? 'block' : 'none';
                chatMessages.scrollTop = chatMessages.scrollHeight;
            }

            // Function to send message to API
            async function sendMessageToAPI(message) {
                try {
                    const response = await fetch('/api/multi-agent', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({ query: message })
                    });

                    if (!response.ok) {
                        throw new Error('Network response was not ok');
                    }

                    const data = await response.json();
                    return data.response || 'Sorry, I couldn\'t process your request.';
                } catch (error) {
                    console.error('Error:', error);
                    return 'Sorry, there was an error processing your request.';
                }
            }

            // Function to handle sending a message
            async function sendMessage() {
                const message = userInput.value.trim();
                if (!message) return;

                // Add user message to chat
                addMessage(message, true);
                
                // Clear input and reset height
                userInput.value = '';
                userInput.style.height = 'auto';
                
                // Show typing indicator
                toggleTypingIndicator(true);
                
                // Disable input and button while processing
                userInput.disabled = true;
                sendButton.disabled = true;
                
                // Get response from API
                const response = await sendMessageToAPI(message);
                
                // Hide typing indicator
                toggleTypingIndicator(false);
                
                // Add bot response to chat
                addMessage(response, false);
                
                // Re-enable input and button
                userInput.disabled = false;
                sendButton.disabled = false;
                userInput.focus();
            }

            // Event listeners
            sendButton.addEventListener('click', sendMessage);
            
            userInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    sendMessage();
                }
            });
            
            // New chat button
            newChatButton.addEventListener('click', function() {
                // Clear all messages except the first bot message
                while (chatMessages.children.length > 1) {
                    if (chatMessages.lastChild !== typingIndicator) {
                        chatMessages.removeChild(chatMessages.lastChild);
                    } else {
                        break;
                    }
                }
            });
        });
    </script>
</body>
</html>
